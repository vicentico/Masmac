name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/vetuberapp

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

    - name: Deploy to Azure Container Apps
      id: deploy
      uses: azure/container-apps-deploy-action@v2
      with:
        acrName: ${{ secrets.ACR_NAME }}
        containerAppName: vetuberapp-staging
        resourceGroup: ${{ secrets.AZURE_RG_STAGING }}
        imageToDeploy: ${{ needs.build-and-push.outputs.image-tag }}
        environmentVariables: |
          ASPNETCORE_ENVIRONMENT=Staging
          MongoDb__ConnectionString=${{ secrets.MONGODB_CONNECTION_STRING_STAGING }}
          MongoDb__DatabaseName=VetUberApp_Staging

    - name: Run smoke tests
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Basic health check
        curl -f ${{ steps.deploy.outputs.webapp-url }}/health/ready || exit 1
        
        # API endpoint test
        curl -f ${{ steps.deploy.outputs.webapp-url }}/api/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}

    - name: Deploy to Azure Container Apps
      id: deploy
      uses: azure/container-apps-deploy-action@v2
      with:
        acrName: ${{ secrets.ACR_NAME }}
        containerAppName: vetuberapp-production
        resourceGroup: ${{ secrets.AZURE_RG_PRODUCTION }}
        imageToDeploy: ${{ needs.build-and-push.outputs.image-tag }}
        environmentVariables: |
          ASPNETCORE_ENVIRONMENT=Production
          MongoDb__ConnectionString=${{ secrets.MONGODB_CONNECTION_STRING_PRODUCTION }}
          MongoDb__DatabaseName=VetUberApp_Production

    - name: Run production smoke tests
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Health checks
        curl -f ${{ steps.deploy.outputs.webapp-url }}/health/ready || exit 1
        curl -f ${{ steps.deploy.outputs.webapp-url }}/api/health || exit 1

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Production deployment successful!"
        echo "URL: ${{ steps.deploy.outputs.webapp-url }}"