name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/*/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ steps.version.outputs.version }}^)
        
        # Generate changelog from commits
        echo "# Changelog" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## What's Changed" >> CHANGELOG.md
        
        git log ${PREVIOUS_TAG}..${{ steps.version.outputs.version }} \
          --pretty=format:"* %s (%h)" \
          --no-merges >> CHANGELOG.md
        
        # Set multiline output
        {
          echo 'changelog<<EOF'
          cat CHANGELOG.md
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore and build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Create release packages
      run: |
        mkdir -p release-assets
        
        # Create published application
        dotnet publish src/VetUberApp.API/VetUberApp.API.csproj \
          -c Release \
          -o release-assets/vetuberapp-${{ steps.version.outputs.version_number }} \
          --no-restore
        
        # Create zip package
        cd release-assets
        zip -r vetuberapp-${{ steps.version.outputs.version_number }}.zip vetuberapp-${{ steps.version.outputs.version_number }}/
        cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        files: |
          release-assets/vetuberapp-${{ steps.version.outputs.version_number }}.zip
        generate_release_notes: true

  trigger-deployment:
    name: Trigger Production Deployment
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Trigger CD Pipeline
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'cd.yml',
            ref: '${{ github.ref }}',
            inputs: {
              environment: 'production'
            }
          })