name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dotnet outdated tool
      run: dotnet tool install --global dotnet-outdated-tool

    - name: Check for outdated packages
      id: outdated
      run: |
        # Check for outdated packages and capture output
        dotnet outdated --upgrade --output json > outdated.json || true
        
        # Check if there are updates available
        if [ -s outdated.json ]; then
          echo "updates_available=true" >> $GITHUB_OUTPUT
        else
          echo "updates_available=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request for updates
      if: steps.outdated.outputs.updates_available == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update NuGet dependencies"
        title: "Automated dependency updates"
        body: |
          ## Automated Dependency Updates
          
          This PR contains automated updates for NuGet packages.
          
          ### Changes
          - Updated outdated NuGet packages to their latest versions
          - All updates follow semantic versioning compatibility
          
          ### Testing
          Please ensure all tests pass before merging.
          
          ### Generated by
          - Workflow: ${{ github.workflow }}
          - Run ID: ${{ github.run_id }}
        branch: automated/dependency-updates
        delete-branch: true
        base: develop